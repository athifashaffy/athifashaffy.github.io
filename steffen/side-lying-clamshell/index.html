<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Side-lying clamshell – COGITO AI</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1d2430;--mute:#5d6878;--line:#dde3ea;--accent:#2f6fd6}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a212b;--fg:#e6ebf1;--mute:#9aa6b5;--line:#2a3440;--accent:#7aa8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-block:24px;padding-inline:16px}
main{max-width:1200px;margin:0 auto;display:grid;gap:20px}
h1{font-size:1.5rem;margin:0}
p{margin:0;color:var(--mute);max-width:70ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.grid{grid-template-columns:1fr}h1{font-size:1.3rem}body{padding-block:16px}}
@media (max-width:480px){table{font-size:.85rem}td,th{padding:6px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.card h2{font-size:1rem;margin:0}
.tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
video{width:100%;border-radius:6px;background:#000;aspect-ratio:16/9}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.wrap{overflow-x:auto}

main{max-width:760px}
</style>
</head>
<body>
<main>
  <div>
    <h1>Side-lying clamshell</h1>
    <p>Bend your knees. Keep feet together; open the top knee.</p>
  </div>
  <div class="card">
    <span class="tag">COGITO AI</span>
    <video src="cogito-woman-clamshell.mp4" controls muted playsinline preload="metadata"></video>
    <p>3 reps on one leg, then 3 on the other leg from the other point of view. Then it stops.</p>
  </div>
</main>
</body>
</html>
